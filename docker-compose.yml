services:    #顶层，Compose文件的新版顶层键（替代旧版version写法），下面每个子项就是一个容器服务
  db:          #定义db服务，这个服务名很重要，Compose会给它创建网络别名db，同一网络内其它容器可以使用db作为主机名访问它
    image: postgres:16     #直接使用官方 PostgreSQL 16 镜像
    environment:           #传给容器的环境变量，官方postgres镜像靠这些做初始化
      POSTGRES_PASSWORD: devpass      #设置postgres超级用户的密码为devpass
      POSTGRES_DB: w1lab     #启动时自动创建一个名为w1lab的数据库
    volumes:             #把命名卷pgdata挂到容器内Postgres的数据目录，使数据持久化
      - pgdata:/var/lib/postgresql/data
    healthcheck:    #  健康检查
      test: ["CMD-SHELL", "pg_isready -U postgres -d w1lab"]
      interval: 5s
      timeout: 3s
      retries: 5
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .  #不用现成镜像，而是用当前目录的 Dockerfile 构建（. 表示构建上下文为当前目录）。
    #ports:
      #- "8000:8000"   #把宿主机 8000 映射到容器 8000，这样浏览器访问 http://localhost:8000 就能到容器里的 uvicorn。
    environment:  #给 api 容器注入数据库连接串。容器里的应用通过读环境变量拿到连接串。
      DATABASE_URL: postgresql+psycopg://postgres:devpass@db:5432/w1lab
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).status == 200 else 1)"
      interval: 5s
      timeout: 3s
      retries: 5
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443" 
    volumes:                 # 挂载
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      api:
        condition: service_healthy
volumes:
  pgdata:




# docker compose up
#  │
#  ├─ 声明/创建命名卷 pgdata
#  ├─ 构建 api 镜像（用 . 的 Dockerfile）
#  ├─ 启动 db 容器
#  │     └─ 每 5s 跑 pg_isready，连续成功 → healthy
#  ├─ 检测到 db healthy
#  └─ 启动 api 容器
#        └─ 读 DATABASE_URL，用 db:5432 连数据库
#              └─ 浏览器访问 localhost:8000 → api
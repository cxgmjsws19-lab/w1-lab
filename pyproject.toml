[project]
name = "w1-lab"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "崔瑞杰", email = "16425798+cui-rogue@user.noreply.gitee.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fakeredis>=2.40.0",
    "fastapi>=0.162.2",
    "httpx>=0.28.1",
    "pydantic>=2.14.2",
    "pyjwt>=2.15.1",
    "rich>=15.0.0",
    "sqlalchemy>=2.1.8",
    "uvicorn>=0.54.0",
]

[project.scripts]
w1-lab = "w1_lab:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

# 国内直连 pypi.org 经常超时，走清华镜像
[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[dependency-groups]
dev = [
    "alembic>=1.20.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
]

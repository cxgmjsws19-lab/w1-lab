name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: 类型检查 + 测试
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: 安装依赖（严格按 uv.lock）
        run: uv sync --frozen

      - name: 类型检查
        run: uv run mypy src tests

      - name: 跑测试
        run: uv run pytest -q

  migrations:
    name: 迁移在真实数据库上跑通
    runs-on: ubuntu-latest
    needs: quality

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: devpass
          POSTGRES_DB: w1lab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d w1lab"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://postgres:devpass@127.0.0.1:5432/w1lab

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: 安装依赖
        run: uv sync --frozen

      - name: 在空数据库上跑到最新版本
        run: uv run alembic upgrade head

      - name: 确认版本表记录正确
        run: uv run alembic current

      - name: 检查模型与数据库是否一致（检测漂移）
        run: uv run alembic check

      - name: 验证 ts 列真的是 timestamptz
        run: |
          uv run python -c "
          from sqlalchemy import create_engine, text
          import os
          e = create_engine(os.environ['DATABASE_URL'])
          with e.connect() as c:
              t = c.execute(text(
                  \"SELECT data_type FROM information_schema.columns \"
                  \"WHERE table_name='log_entries' AND column_name='ts'\"
              )).scalar()
          print('ts data_type =', t)
          assert t == 'timestamp with time zone', f'期望 timestamptz，实际 {t}'
          "

  docker:
    name: 构建镜像
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 构建镜像
        run: docker build -t w1-lab:ci .

      - name: 冒烟测试（镜像里的包能 import）
        run: docker run --rm w1-lab:ci python -c "import w1_lab; print('import ok')"

      - name: 冒烟测试（迁移链在镜像里也能加载）
        run: docker run --rm w1-lab:ci alembic history

      - name: 校验 compose 配置语法
        run: docker compose config > /dev/null

# 定义一个server块，即一个虚拟主机，代表一个站点/监听端点
# 监听所有IPv4地址的80
# 声明该server块匹配的主机名，Nginx 根据请求头 Host 与 server_name 匹配来选择用哪个 server 块处理请求。
#定义一个location块，匹配 URI 前缀 /，即所有请求路径（因为任何 URI 都以 / 开头）。它是这个 server 的兜底路由
# proxy_pass 把匹配到的请求反向代理到上游服务。
#因为 proxy_pass 后面没有带 URI 路径（如 http://api:8000/），Nginx 会把原始请求 URI 原样传给上游。例如请求 /users/1?x=2，转发后上游收到 /users/1?x=2。
# 设置转发给上游的请求头 Host，作用：让上游应用知道客户端实际访问的域名（很多框架用它生成绝对 URL、做虚拟主机路由）。
# $host 是 Nginx 变量：优先取请求行中的主机名，其次 Host 头，最后是匹配到的 server_name。
# 设置 X-Real-IP 头为直连客户端 IP（$remote_addr）。上游应用常用它获取真实客户端 IP（否则看到的是 Nginx 的 IP）。
# 设置 X-Forwarded-For（XFF）头，记录请求经过的代理链。
#$proxy_add_x_forwarded_for = 客户端原有的 X-Forwarded-For 头 + , + $remote_addr
# 设置 X-Forwarded-Proto 头为原始请求使用的协议（$scheme 为 http 或 https）。
#ssl_certificate：服务器证书路径（PEM 格式）。
#ssl_certificate_key：私钥路径（PEM 格式），必须与证书公钥配对。
server {
    listen 80;
    server_name localhost;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name localhost;

    ssl_certificate  /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://api:8000;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}